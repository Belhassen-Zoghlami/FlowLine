services:
  db:
    image: postgres:16
    container_name: flowline-db
    environment:
      POSTGRES_DB: flowline
      POSTGRES_USER: flowline
      POSTGRES_PASSWORD: flowline
    ports:
      - "5432:5432"
    volumes:
      - flowline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowline-pgdata: